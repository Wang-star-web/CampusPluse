<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusPulse · 校园开放日</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#0f1419; color:#e6e8eb; padding:24px; }
  .head { display:flex; align-items:center; gap:12px; margin-bottom:4px; flex-wrap:wrap; }
  h1 { font-size:22px; }
  .badge { font-size:12px; color:#8b949e; border:1px solid #30363d; border-radius:999px; padding:2px 10px; font-family:Consolas,monospace; }
  .sub { color:#8b949e; font-size:13px; margin-bottom:20px; }
  .status { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#8b949e; margin-left:auto; }
  .status i { width:8px; height:8px; border-radius:50%; display:inline-block; background:#6e7681; }
  .status.connected i { background:#58a6ff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:10px; padding:16px; }
  .card h3 { font-size:14px; color:#58a6ff; margin-bottom:10px; }
  .value { font-size:32px; font-weight:700; }
  .unit { font-size:12px; color:#6e7681; margin-top:2px; }
  .meta { margin-top:10px; font-size:12px; color:#8b949e; line-height:1.8; font-family:Consolas,monospace; }
  .card.flash { animation:flash .6s; }
  @keyframes flash { 0% { border-color:#58a6ff; } 100% { border-color:#30363d; } }
  .footer { margin-top:20px; font-size:12px; color:#8b949e; border-top:1px dashed #21262d; padding-top:12px; }
</style>
</head>
<body>
  <div class="head">
    <h1>CampusPulse · 校园开放日</h1>
    <span class="badge" id="activity">activity_id: —</span>
    <span class="status" id="conn"><i></i><span id="conn-text">连接中…</span></span>
  </div>
  <div class="sub">A00 阶段01 最小看板 · 只展示数据源原始数值（本阶段不做态势计算）</div>

  <div class="grid">
    <div class="card" id="card-crowd"><h3>人群数量 crowd</h3><div class="value" id="v-crowd">—</div><div class="unit">人</div><div class="meta" id="m-crowd"></div></div>
    <div class="card" id="card-entrance"><h3>入口 entrance</h3><div class="value" id="v-entrance">—</div><div class="unit">开放数 / 总数</div><div class="meta" id="m-entrance"></div></div>
    <div class="card" id="card-main_route"><h3>主要路线 main_route</h3><div class="value" id="v-main_route">—</div><div class="unit">状态</div><div class="meta" id="m-main_route"></div></div>
    <div class="card" id="card-support"><h3>支持人员 support</h3><div class="value" id="v-support">—</div><div class="unit">人</div><div class="meta" id="m-support"></div></div>
  </div>

  <div class="footer">数据状态：持续更新 · 来源：SIMULATED（模拟数据）</div>

<script>
const OBJECTS = ['crowd', 'entrance', 'main_route', 'support'];
// 只把原始业务值渲染成文本，不做任何比较/换算/着色（本阶段不引入态势语义）
const valueText = {
  crowd: d => String(d.count),
  entrance: d => `${d.available} / ${d.total}`,
  main_route: d => String(d.status),
  support: d => String(d.count),
};
const metaText = env => `observed_at: ${(env.observed_at || '').slice(11, 19)} · source_type: ${env.source_type}`;

function renderObject(objectType, envelope) {
  const v = document.getElementById('v-' + objectType);
  const m = document.getElementById('m-' + objectType);
  const txt = valueText[objectType](envelope.data);
  if (v.textContent !== txt) {
    v.textContent = txt;
    const card = document.getElementById('card-' + objectType);
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  }
  m.textContent = metaText(envelope);
}

function renderSnapshot(payload) {
  document.getElementById('activity').textContent = 'activity_id: ' + payload.activity_id;
  const seen = new Set(Object.keys(payload.objects || {}));
  for (const [ot, env] of Object.entries(payload.objects || {})) renderObject(ot, env);
  for (const ot of OBJECTS) if (!seen.has(ot)) { // 尚未收到数据的对象保持占位
    document.getElementById('v-' + ot).textContent = '—';
    document.getElementById('m-' + ot).textContent = '等待数据';
  }
}

function setConn(state, text) {
  const el = document.getElementById('conn');
  el.className = 'status' + (state === 'connected' ? ' connected' : '');
  document.getElementById('conn-text').textContent = text;
}

let retryDelay = 1;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { retryDelay = 1; setConn('connected', '已连接'); };
  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.type === 'snapshot') renderSnapshot(msg.payload);
    else if (msg.type === 'update' && OBJECTS.includes(msg.object_type)) renderObject(msg.object_type, msg.envelope);
  };
  ws.onclose = () => {
    setConn('disconnected', `已断开，${retryDelay}s 后重连…`);
    setTimeout(connect, retryDelay * 1000);
    retryDelay = Math.min(retryDelay * 2, 8); // 指数退避，封顶 8s
  };
  ws.onerror = () => { ws.close(); };
}
connect();
</script>
</body>
</html>
